function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryDecrypt(password) {
  const enc = new TextEncoder();
  const salt = b64ToBytes(PAYLOAD.salt);
  const iv = b64ToBytes(PAYLOAD.iv);
  const ciphertext = b64ToBytes(PAYLOAD.ciphertext);

  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations: PAYLOAD.iterations, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    false,
    ['decrypt']
  );

  const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ciphertext);
  return new TextDecoder().decode(plainBuf);
}

async function submit() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const loading = document.getElementById('loading');
  err.style.display = 'none';
  loading.style.display = 'block';
  try {
    const html = await tryDecrypt(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    loading.style.display = 'none';
    err.style.display = 'block';
  }
}

document.getElementById('btn').addEventListener('click', submit);
document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
