<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - Imagens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 900px;
            width: 100%;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }
        
        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        
        .card-content {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .card-url {
            font-size: 14px;
            color: #667eea;
            word-break: break-all;
        }
        
        .card:hover .card-title {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logo Card -->
        <a href="https://markinvestconstrutora.com.br/" class="card" target="_blank" rel="noopener noreferrer">
            <img src="logo.svg" alt="Mark Invest Construtora" class="card-image">
            <div class="card-content">
                <h2 class="card-title">Mark Invest Construtora</h2>
                <p class="card-url">markinvestconstrutora.com.br</p>
            </div>
        </a>
        
        <!-- Image2 Card -->
        <a href="https://residencialparqueolimpia.com.br/" class="card" target="_blank" rel="noopener noreferrer">
            <img src="imagem2.png" alt="Residencial Parque Olímpia" class="card-image">
            <div class="card-content">
                <h2 class="card-title">Residencial Parque Olímpia</h2>
                <p class="card-url">residencialparqueolimpia.com.br</p>
            </div>
        </a>
    </div>
</body>
</html>
